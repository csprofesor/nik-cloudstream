name: Domain Değişiklik Kontrolü

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: 11 */9 * * *

jobs:
  DomainKontrol:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Depo Kontrolü
        uses: actions/checkout@v4
      - name: Python 3.11.8 Yükle
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.8
      - name: Python Sürümünü Göster
        run: python -c "import sys; print(sys.version)"
      - name: Gereksinimleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools wheel Kekik cloudscraper
      - name: Betiği Çalıştır
        run: python KONTROL.py
      - name: Değişiklik Kontrolü
        id: degisiklik_kontrol
        run: |
          if git diff --quiet .; then
            echo "degisiklik=false" >> "$GITHUB_OUTPUT"
          else
            echo "degisiklik=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull Request Oluştur ve Otomatik Birleştir
        if: steps.degisiklik_kontrol.outputs.degisiklik == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "♻️ Domain Değişikliği" -m "🔄 Otomatik domain güncellemeleri yapıldı."

          BRANCH="domain-degisikligi"
          git checkout -B "$BRANCH"
          git push origin "$BRANCH" --force

          PR_NUMBER=$(gh pr list --base master --head "$BRANCH" --state open --json number --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "♻️ Domain Değişikliği" \
              --body "🔄 Otomatik tespit edilen domain değişiklikleri uygulandı.\n\n🤖 Değişiklikler doğrulandıktan sonra otomatik olarak birleştirilecektir.")
            PR_NUMBER=$(echo "$PR_NUMBER" | grep -oE '[0-9]+$')
          fi

          echo "PR #$PR_NUMBER hazır. Otomatik birleştirme başlatılıyor."

          # GitHub API ile squash merge dene; branch koruma/inceleme gerektirirse
          # workflow başarısız olur ve değişiklik master'a dokunulmadan kalır.
          gh pr merge "$PR_NUMBER" --squash --delete-branch --admin || \
          gh pr merge "$PR_NUMBER" --squash --delete-branch
