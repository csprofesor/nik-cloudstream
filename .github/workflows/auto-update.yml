name: 🔄 Eklenti Güncelleyici

on:
  schedule:
    # Her gün saat 06:00 UTC'de çalışır (09:00 Türkiye saati)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-plugins:
    runs-on: ubuntu-latest
    name: 🔍 Eklentileri Kontrol Et ve Güncelle

    steps:
      - name: 📥 Deposu İndir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper requests

      - name: 🔄 Eklentileri Güncelle
        id: update
        run: |
          python KONTROL.py
          
          # Git durumunu kontrol et
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: 📋 Değişiklikleri Göster
        if: steps.update.outputs.has_changes == 'true'
        run: |
          echo "## 📊 Güncellenen Eklentiler" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          git diff --name-only >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Değişiklik Detayları:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git diff --stat >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: ⚙️ Git Yapılandırması
        if: steps.update.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"

      - name: 📤 Değişiklikleri Commit Et
        if: steps.update.outputs.has_changes == 'true'
        run: |
          git add .
          git commit -m "🔄 Otomatik Eklenti Güncellemesi

- mainUrl'leri kontrol et
- Versiyonları artır
- Kütüphane bağımlılıklarını güncelle

[skip ci]" || echo "Commit başarısız - değişiklik yok"

      - name: 🚀 Değişiklikleri Push Et
        if: steps.update.outputs.has_changes == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          force: false

      - name: ✅ Güncelleme Başarılı
        if: steps.update.outputs.has_changes == 'true'
        run: |
          echo "✅ Eklentiler başarıyla güncellendi ve push edildi!"

      - name: ⏭️ Değişiklik Yok
        if: steps.update.outputs.has_changes == 'false'
        run: |
          echo "✓ Tüm eklentiler güncel durumda"
