name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}
      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}
      - name: Cache Temizle
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.m2/repository
      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 17
      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2
      - name: HintFilmIzle Kaynak Düzeltmeleri
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt")
          s = p.read_text(encoding="utf-8-sig")

          old_decoder = '''        return Regex("https?://[^\\\"'\\\\s<>]+\\\\.kinescopecdn\\\\.net/hls/[^\\\"'\\\\s<>]+/index\\\\.m3u8(?:\\\\?[^\\\"'\\\\s<>]*)?", RegexOption.IGNORE_CASE).find(decoded)?.value?.replace("\\\\/", "/")?.replace("\\\\u0026", "&")'''
          new_decoder = '''        val labelled = Regex("\\\\[(\\\\d{3,4})p\\\\]\\\\{[^}]*\\\\}(https?://[^\\\"'\\\\s<>]+\\\\.kinescopecdn\\\\.net/hls/[^\\\"',\\\\s<>]+/index\\\\.m3u8(?:\\\\?[^\\\"',\\\\s<>]*)?)", RegexOption.IGNORE_CASE)
            .findAll(decoded)
            .mapNotNull { m -> m.groupValues.getOrNull(1)?.toIntOrNull()?.let { it to m.groupValues[2] } }
            .maxByOrNull { it.first }?.second
          val fallback = Regex("https?://[^\\\"'\\\\s<>]+\\\\.kinescopecdn\\\\.net/hls/[^\\\"',\\\\s<>]+/index\\\\.m3u8(?:\\\\?[^\\\"',\\\\s<>]*)?", RegexOption.IGNORE_CASE).find(decoded)?.value
          return (labelled ?: fallback)?.replace("\\\\/", "/")?.replace("\\\\u0026", "&")'''
          if old_decoder not in s:
              raise SystemExit("Kinescope decoder pattern not found")
          s = s.replace(old_decoder, new_decoder, 1)

          old_block = '''        val intercept = Regex(
            "\\\\.kinescopecdn\\\\.net/hls/.+/index\\\\.m3u8(?:\\\\?.*)?$",
            RegexOption.IGNORE_CASE
        )
        val resolver = WebViewResolver(
            interceptUrl = intercept,
            additionalUrls = emptyList(),
            userAgent = ua,
            useOkhttp = true,
            timeout = 90_000L,
            script = script
        )

        resolver.resolveUsingWebView(
            kine,
            referer = parent,
            headers = mapOf("Referer" to parent, "Origin" to mainUrl, "User-Agent" to ua)
        ) { req ->
            val u = req.url.toString()
            if (m3u.containsMatchIn(u)) {
                stream = u
                Log.d("HintFilmIzle", "KINESCOPE_MANIFEST=" + u)
                true
            } else {
                false
            }
        }

        val final = stream ?: return false'''
          new_block = '''        // Kinescope now requests /api/v1/embed/{id} before the HLS URL is exposed.
        // The API URL contains a fresh signature generated by the Kinescope page, so
        // capture that already-signed URL from WebView and fetch/decode its response.
        val apiIntercept = Regex(
            "\\\\.kinescopecdn\\\\.net/api/v1/embed/[A-Za-z0-9_-]+(?:\\\\?.*)?$",
            RegexOption.IGNORE_CASE
        )
        var apiUrl: String? = null
        val resolver = WebViewResolver(
            interceptUrl = apiIntercept,
            additionalUrls = emptyList(),
            userAgent = ua,
            useOkhttp = true,
            timeout = 45_000L,
            script = script
        )

        resolver.resolveUsingWebView(
            kine,
            referer = parent,
            headers = mapOf("Referer" to parent, "Origin" to mainUrl, "User-Agent" to ua)
        ) { req ->
            val u = req.url.toString()
            if (apiIntercept.containsMatchIn(u)) {
                apiUrl = u
                Log.d("HintFilmIzle", "KINESCOPE_API=" + u)
                true
            } else false
        }

        if (stream == null && apiUrl != null) {
            val apiBody = runCatching {
                app.get(
                    apiUrl!!,
                    referer = kine,
                    headers = mapOf("Referer" to kine, "Origin" to mainUrl, "User-Agent" to ua, "Accept" to "application/json,text/plain,*/*")
                ).text
            }.getOrNull()
            stream = apiBody?.let { decodeKinescopeApi(it) }
            if (stream != null) Log.d("HintFilmIzle", "KINESCOPE_MANIFEST=" + stream)
        }

        val final = stream ?: return false'''
          if old_block not in s:
              raise SystemExit("Kinescope WebView resolver block not found")
          s = s.replace(old_block, new_block, 1)

          p.write_text(s, encoding="utf-8")
          PY
          echo "HintFilmIzle: Kinescope API capture + decoder fix applied"
      - name: HintFilmIzle Derleme Kontrolü
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          success=0
          for attempt in 1 2 3; do
            echo "HintFilmIzle derleme denemesi $attempt/3"
            if ./gradlew :HintFilmIzle:make --stacktrace; then
              success=1
              break
            fi
            rm -rf ~/.gradle/caches
          done
          test "$success" = 1
      - name: Tüm Eklentileri Derle
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          success=0
          for attempt in 1 2 3; do
            echo "Tüm eklenti derleme denemesi $attempt/3"
            if ./gradlew make --stacktrace; then
              success=1
              break
            fi
            rm -rf ~/.gradle/caches
          done
          test "$success" = 1
      - name: "'build' Derlemelerini Yükle"
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/builds"
          find . -maxdepth 1 -name "*.cs3" -type f -delete
          find "$GITHUB_WORKSPACE/src" -mindepth 2 -path "*/build/*.cs3" -type f -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path.cwd()
          manifest = root / 'plugins.json'
          if manifest.exists():
              data = json.loads(manifest.read_text(encoding='utf-8'))
              built = {p.stem: p for p in root.glob('*.cs3')}
              data = [item for item in data if item.get('internalName') in built]
              for item in data:
                  target = built.get(item.get('internalName', ''))
                  if target:
                      digest = hashlib.sha256(target.read_bytes()).hexdigest()
                      item['fileSize'] = target.stat().st_size
                      item['fileHash'] = f'sha256-{digest}'
                      item['url'] = f'https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/{target.name}?v={os.environ.get("GITHUB_SHA", "build")}'
              manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add *.cs3 plugins.json
          git commit -m "Yeni tüm eklenti derlemeleri: $GITHUB_SHA" || exit 0
          git push origin HEAD:builds --force
