name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"
          fetch-depth: 0
          persist-credentials: false

      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"
          persist-credentials: false

      - name: Eski Derlemeleri Temizle
        run: find $GITHUB_WORKSPACE/builds -name '*.cs3' -delete

      - name: Cache Temizle
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.m2/repository

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 17

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2

      - name: Güncel Domainleri Uygula
        run: |
          cd $GITHUB_WORKSPACE/src
          sed -i 's#https://dizigom101.com#https://www.dizigom.love#g' DiziGom/src/main/kotlin/com/nikyokki/DiziGom.kt
          sed -i 's#https://www.dizimom.bid#https://www.dizimom.work#g; s#https://www.dizimom.surf#https://www.dizimom.work#g' DiziMom/src/main/kotlin/com/keyiflerolsun/DiziMom.kt
          sed -i 's#https://dizipal1214.com#https://dizipalt.com#g' DiziPal/src/main/kotlin/com/keyiflerolsun/DiziPal.kt
          sed -i 's#https://www.setfilmizle.uk#https://setfilmizle.ltd#g; s#https://setfilmizle.uk#https://setfilmizle.ltd#g' SetFilmIzle/src/main/kotlin/com/keyiflerolsun/SetFilmIzle.kt
          sed -i 's#dizigom1.co#www.dizigom.love#g; s/tvTypes = listOf("Movie")/tvTypes = listOf("TvSeries")/' DiziGom/build.gradle.kts
          sed -i 's#www.dizibox.de#www.dizibox.live#g' DiziBox/build.gradle.kts
          sed -i 's#dizikorea.vip#dizikorea3.com#g' DiziKorea/build.gradle.kts
          sed -i 's#www.dizimom.tv#www.dizimom.work#g; s#www.dizimom.surf#www.dizimom.work#g' DiziMom/build.gradle.kts
          sed -i 's#dizipal683.com#dizipalt.com#g' DiziPal/build.gradle.kts
          sed -i 's#dizilla.club#dizilla.now#g; s#dizilla40.com#dizilla.now#g' Dizilla/build.gradle.kts
          sed -i 's#https://dizilla40.com#https://dizilla.now#g; s#https://dizilla.to#https://dizilla.now#g' Dizilla/src/main/kotlin/com/keyiflerolsun/Dizilla.kt
          sed -i 's#https://www.setfilmizle.uk#https://setfilmizle.ltd#g; s#https://setfilmizle.uk#https://setfilmizle.ltd#g' SetFilmIzle/build.gradle.kts
          sed -i 's#dizimag.net#dizimag.com.tr#g' DiziMag/build.gradle.kts

      - name: TurkAnime Kotlin Uyumluluk Düzeltmesi
        run: |
          cd $GITHUB_WORKSPACE/src
          sed -i 's/private fun iframe2AesLink/private suspend fun iframe2AesLink/' TurkAnime/src/main/kotlin/com/keyiflerolsun/TurkAnime.kt

      - name: DiziGom Kotlin Uyumluluk Düzeltmesi
        run: |
          cd $GITHUB_WORKSPACE/src
          sed -i 's/yield(img.parent()?.attr("style"))/yield(img.parent()?.attr("style").orEmpty())/; s/yield(backgroundUrl())/yield(backgroundUrl().orEmpty())/' DiziGom/src/main/kotlin/com/nikyokki/DiziGom.kt

      - name: Eklentileri Derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          shopt -s globstar
          ./gradlew make makePluginsJson --stacktrace

          # Anizm ve HintFilmIzle için her derlemede yeni URL + sürüm bilgisi üret.
          # Böylece CloudStream/CDN eski .cs3 dosyasını önbellekten kullanmaz.
          python3 - <<'PY'
          import json, re, os, subprocess
          p = "build/plugins.json"
          with open(p, encoding="utf-8") as f:
              data = json.load(f)

          # CloudStream yalnızca sürüm numarası yükseldiğinde eklentiyi yeniden
          # indirir. GitHub Actions'ın varsayılan sığ checkout'u commit sayısını
          # her çalışmada 1 yapabildiğinden, monotonik workflow run numarasını
          # kullanıyoruz.
          commit_count = int(os.environ.get("GITHUB_RUN_NUMBER") or subprocess.check_output(
              ["git", "rev-list", "--count", "HEAD"], text=True
          ).strip())
          sha = os.environ.get("GITHUB_SHA", "")[:12]

          versions = {
              "Anizm": commit_count,
              "HintFilmIzle": commit_count,
          }

          files = {
              "Anizm": "Anizm.cs3",
              "HintFilmIzle": "HintFilmIzle.cs3",
          }

          for internal_name, filename in files.items():
              entry = next((x for x in data if x.get("internalName") == internal_name), None)
              if entry is None:
                  entry = {
                      "url": f"https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/{filename}",
                      "status": 1,
                      "version": versions[internal_name],
                      "name": "HintFilmİzle" if internal_name == "HintFilmIzle" else "Anizm",
                      "internalName": internal_name,
                      "authors": ["csprofesor"],
                      "language": "tr",
                      "apiVersion": 1,
                  }
                  data.append(entry)

              entry["version"] = versions[internal_name]
              entry["url"] = f"https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/{filename}?v={sha}"
          
          # HintFilmIzle'nin özel metadata alanlarını koru.
          hint = next(x for x in data if x.get("internalName") == "HintFilmIzle")
          hint.update({
              "status": 1,
              "name": "HintFilmİzle",
              "authors": ["csprofesor"],
              "description": "HintFilmizle.com Hint filmleri, yabancı filmler ve diziler",
              "repositoryUrl": "https://github.com/csprofesor/nik-cloudstream",
              "language": "tr",
              "tvTypes": ["Movie", "TvSeries"],
              "iconUrl": "https://www.google.com/s2/favicons?domain=www.hintfilmizle.com&sz=%size%",
              "apiVersion": 1,
          })

          with open(p, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

          sed -i 's#https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/SetFilmIzle.cs3"#https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/SetFilmIzle.cs3?v=36"#' build/plugins.json
          sed -i 's#https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/DiziGom.cs3"#https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/DiziGom.cs3?v=13"#' build/plugins.json
          sed -i 's#https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/DiziPalOriginal.cs3"#https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/DiziPalOriginal.cs3?v=84"#' build/plugins.json
          python3 - <<'PY'
          import json, os
          p = "build/plugins.json"
          with open(p, encoding="utf-8") as f:
              data = json.load(f)
          if not any(x.get("internalName") == "HintFilmIzle" for x in data):
              size = os.path.getsize("HintFilmIzle/build/outputs/aar/HintFilmIzle-release.aar") if os.path.exists("HintFilmIzle/build/outputs/aar/HintFilmIzle-release.aar") else 0
              data.append({
                  "url": "https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/HintFilmIzle.cs3",
                  "status": 1,
                  "version": 1,
                  "name": "HintFilmİzle",
                  "internalName": "HintFilmIzle",
                  "authors": ["csprofesor"],
                  "description": "HintFilmizle.com Hint filmleri, yabancı filmler ve diziler",
                  "fileSize": size,
                  "repositoryUrl": "https://github.com/csprofesor/nik-cloudstream",
                  "language": "tr",
                  "tvTypes": ["Movie", "TvSeries"],
                  "iconUrl": "https://www.google.com/s2/favicons?domain=www.hintfilmizle.com&sz=%size%",
                  "apiVersion": 1
              })
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
          PY
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds
          cp repo.json $GITHUB_WORKSPACE/builds/repo.json

      - name: Derlemeleri Yükle
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Yeni Derleme: $GITHUB_SHA" || exit 0
          git push --force
