name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"

      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"

      - name: Eski Derlemeleri Temizle
        run: find $GITHUB_WORKSPACE/builds -name '*.cs3' -delete

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 17

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2

      - name: Güncel Site Kodlarını Uygula
        run: |
          cd $GITHUB_WORKSPACE/src

          sed -i 's#https://dizigom101.com#https://www.dizigom.love#g' DiziGom/src/main/kotlin/com/nikyokki/DiziGom.kt
          sed -i 's#https://www.dizimom.bid#https://www.dizimom.surf#g' DiziMom/src/main/kotlin/com/keyiflerolsun/DiziMom.kt
          sed -i 's#https://dizipal1214.com#https://dizipalt.com#g' DiziPal/src/main/kotlin/com/keyiflerolsun/DiziPal.kt
          sed -i 's#https://www.setfilmizle.uk#https://setfilmizle.ltd#g; s#https://setfilmizle.uk#https://setfilmizle.ltd#g' SetFilmIzle/src/main/kotlin/com/keyiflerolsun/SetFilmIzle.kt

          # Güncel site adreslerini eklenti metadata'sına da yansıt
          sed -i 's#dizigom1.co#www.dizigom.love#g; s/tvTypes = listOf("Movie")/tvTypes = listOf("TvSeries")/' DiziGom/build.gradle.kts
          sed -i 's#www.dizibox.de#www.dizibox.live#g' DiziBox/build.gradle.kts
          sed -i 's#dizikorea.vip#dizikorea3.com#g' DiziKorea/build.gradle.kts
          sed -i 's#www.dizimom.tv#www.dizimom.surf#g' DiziMom/build.gradle.kts
          sed -i 's#dizipal683.com#dizipalt.com#g' DiziPal/build.gradle.kts
          # Dizilla'nın güncel adresini build sırasında eski domaine çevirmiyoruz.
          sed -i 's#dizilla.club#dizilla.now#g' Dizilla/build.gradle.kts
          sed -i 's#dizilla40.com#dizilla.now#g' Dizilla/build.gradle.kts
          sed -i 's#https://dizilla40.com#https://dizilla.now#g' Dizilla/src/main/kotlin/com/keyiflerolsun/Dizilla.kt
          sed -i 's#https://dizilla.to#https://dizilla.now#g' Dizilla/src/main/kotlin/com/keyiflerolsun/Dizilla.kt
          sed -i 's#https://www.setfilmizle.uk#https://setfilmizle.ltd#g; s#https://setfilmizle.uk#https://setfilmizle.ltd#g' SetFilmIzle/build.gradle.kts

          curl -fsSL https://raw.githubusercontent.com/feroxx/Kekik-cloudstream/master/DiziKorea/src/main/kotlin/com/keyiflerolsun/DiziKorea.kt -o DiziKorea/src/main/kotlin/com/keyiflerolsun/DiziKorea.kt
          curl -fsSL https://raw.githubusercontent.com/feroxx/Kekik-cloudstream/master/DiziKorea/src/main/kotlin/com/keyiflerolsun/DiziKoreaModels.kt -o DiziKorea/src/main/kotlin/com/keyiflerolsun/DiziKoreaModels.kt
          curl -fsSL https://raw.githubusercontent.com/feroxx/Kekik-cloudstream/master/DiziKorea/src/main/kotlin/com/keyiflerolsun/DiziKoreaPlugin.kt -o DiziKorea/src/main/kotlin/com/keyiflerolsun/DiziKoreaPlugin.kt
          curl -fsSL https://raw.githubusercontent.com/feroxx/Kekik-cloudstream/master/DiziKorea/src/main/kotlin/com/keyiflerolsun/PlayerKoreaExtractor.kt -o DiziKorea/src/main/kotlin/com/keyiflerolsun/PlayerKoreaExtractor.kt

      - name: TurkAnime Kotlin Uyumluluk Düzeltmesi
        run: |
          cd $GITHUB_WORKSPACE/src
          sed -i 's/private fun iframe2AesLink/private suspend fun iframe2AesLink/' TurkAnime/src/main/kotlin/com/keyiflerolsun/TurkAnime.kt

      - name: Güncellenen Kaynakları Kaydet
        run: |
          cd $GITHUB_WORKSPACE/src
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add DiziGom/src DiziGom/build.gradle.kts DiziMom/src DiziMom/build.gradle.kts DiziPal/src DiziPal/build.gradle.kts DiziKorea/src DiziKorea/build.gradle.kts DiziBox/build.gradle.kts Dizilla/build.gradle.kts Dizilla/src SetFilmIzle/src SetFilmIzle/build.gradle.kts TurkAnime/src
          git commit -m "Dizilla güncel domain düzeltmesi [skip ci]" || true
          git push origin HEAD:master || true

      - name: Eklentileri Derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          # SetFilmIzle için GitHub Raw/CDN önbelleğini kır; aksi halde yeni .cs3 yerine eski dosya indirilebilir.
          sed -i 's#https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/SetFilmIzle.cs3"#https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/SetFilmIzle.cs3?v=36"#' build/plugins.json
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Derlemeleri Yükle
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Yeni Derleme: $GITHUB_SHA" || exit 0
          git push --force
