name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"
          fetch-depth: 0
          persist-credentials: false

      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: HintFilmIzle Derlemesini Temizle
        run: rm -f "$GITHUB_WORKSPACE/builds/HintFilmIzle.cs3"

      - name: Cache Temizle
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.m2/repository

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 17

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2

      - name: HintFilmIzle Derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew :HintFilmIzle:make --stacktrace

      - name: HintFilmIzle Derlemesini Yükle
        run: |
          cd $GITHUB_WORKSPACE/builds
          cp $GITHUB_WORKSPACE/src/HintFilmIzle/build/*.cs3 ./HintFilmIzle.cs3
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add HintFilmIzle.cs3
          git commit -m "Yeni HintFilmIzle Derlemesi: $GITHUB_SHA" || exit 0
          git push origin HEAD:builds --force
