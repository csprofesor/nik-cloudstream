name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}
      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}
      - name: Cache Temizle
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.m2/repository
      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 17
      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2
      - name: Kinescope Android WebView Voiceover Testi
        run: |
          cd $GITHUB_WORKSPACE/src
          python3 - <<'PY'
          from pathlib import Path
          p = Path('HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt')
          s = p.read_text(encoding='utf-8')
          old_player = '''if (!id.isNullOrBlank()) return "https://river-3-329.kinescopecdn.net/677113747/embed/" + id + "?design=3&lang=" + URLEncoder.encode(lang.ifBlank { "tr" }, "UTF-8") + "&nc=" + (System.currentTimeMillis() / 1000L)'''
          new_player = '''if (!id.isNullOrBlank()) {
                val voiceover = Regex("""[?&]voiceover=([^&]+)""", RegexOption.IGNORE_CASE).find(url)?.groupValues?.getOrNull(1)
                return "https://river-3-329.kinescopecdn.net/677113747/embed/" + id + "?design=3&lang=" + URLEncoder.encode(lang.ifBlank { "tr" }, "UTF-8") + (voiceover?.let { "&voiceover=" + it } ?: "") + "&nc=" + (System.currentTimeMillis() / 1000L)
            }'''
          if old_player not in s:
              raise SystemExit('playerUrl voiceover hedefi bulunamadı')
          s = s.replace(old_player, new_player, 1)
          old_live = '''append("https://river-3-329.kinescopecdn.net/677113747/embed/"); append(videoId); append("?design=3&lang="); append(URLEncoder.encode(lang.ifBlank { "tr" }, "UTF-8")); append("&autoplay=1&muted=1&preload=1&playsinline=1&background=1&enableIframeApi=1&nc="); append(System.currentTimeMillis() / 1000L)'''
          new_live = '''val voiceover = Regex("""[?&]voiceover=([^&]+)""", RegexOption.IGNORE_CASE).find(iframeUrl)?.groupValues?.getOrNull(1)
            append("https://river-3-329.kinescopecdn.net/677113747/embed/"); append(videoId); append("?design=3&lang="); append(URLEncoder.encode(lang.ifBlank { "tr" }, "UTF-8")); voiceover?.let { append("&voiceover="); append(it) }; append("&autoplay=1&muted=1&preload=1&playsinline=1&background=1&enableIframeApi=1&nc="); append(System.currentTimeMillis() / 1000L)'''
          if old_live not in s:
              raise SystemExit('loadKinescope voiceover hedefi bulunamadı')
          s = s.replace(old_live, new_live, 1)
          p.write_text(s, encoding='utf-8')
          print('Build test: Kinescope voiceover query parameter is preserved; master source remains unchanged.')
          PY
      - name: Tüm Eklentileri Derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make --stacktrace
      - name: Tüm Derlemeleri Yükle
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/builds
          find . -maxdepth 1 -name "*.cs3" -type f -delete
          find "$GITHUB_WORKSPACE/src" -mindepth 2 -path "*/build/*.cs3" -type f -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path.cwd(); manifest = root / 'plugins.json'
          if manifest.exists():
              data = json.loads(manifest.read_text(encoding='utf-8'))
              built = {p.stem: p for p in root.glob('*.cs3')}
              data = [item for item in data if item.get('internalName') in built]
              updated = 0
              for item in data:
                  internal = item.get('internalName')
                  target = built.get(internal or '')
                  if not target:
                      continue
                  digest = hashlib.sha256(target.read_bytes()).hexdigest()
                  item['fileSize'] = target.stat().st_size
                  item['fileHash'] = f'sha256-{digest}'
                  item['url'] = f'https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/{target.name}?v={os.environ.get("GITHUB_SHA", "build")}'; updated += 1
              manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(f'Updated manifest entries: {updated}')
          PY
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add *.cs3 plugins.json
          git commit -m "Yeni tüm eklenti derlemeleri: $GITHUB_SHA" || exit 0
          git push origin HEAD:builds --force

# Force a fresh manifest rebuild after plugin removals.
