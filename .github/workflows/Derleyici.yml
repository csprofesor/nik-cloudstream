name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}
      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}
      - name: Cache Temizle
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.m2/repository
      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 17
      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2
      - name: HintFilmIzle Kinescope API Düzeltmesi
        run: |
          cd $GITHUB_WORKSPACE/src
          python3 - <<'PY'
          from pathlib import Path
          p = Path('HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt')
          s = p.read_text(encoding='utf-8')

          player_old = '            return "https://river-3-329.kinescopecdn.net/677113747/embed/$id?voiceover=487&design=3&lang=tr&nc=${System.currentTimeMillis() / 1000L}"'
          if player_old in s:
              s = s.replace(player_old, '            return u', 1)

          target_old = '        val target = "https://river-3-329.kinescopecdn.net/677113747/embed/$id?voiceover=487&design=3&lang=tr&autoplay=1&muted=1&preload=1&playsinline=1&enableIframeApi=1&nc=${System.currentTimeMillis() / 1000L}"'
          if target_old in s:
              s = s.replace(target_old, '        val target = kine', 1)

          marker = '    private suspend fun kinescope(kine: String, parent: String, callback: (ExtractorLink) -> Unit): Boolean = runCatching {'
          decoder = '''    private fun decodeKinescopeApi(body: String): String? {
        val encoded = Regex("\\\"p\\\"\\s*:\\s*\\\"([^\\\"]+)\\\"")
            .find(body)?.groupValues?.getOrNull(1) ?: return null
        val encrypted = runCatching {
            android.util.Base64.decode(encoded.reversed(), android.util.Base64.DEFAULT)
        }.getOrNull() ?: return null
        val key = "RySdvcyu5iTUxn97vn4HwoniwgxaCynA".toByteArray(Charsets.UTF_8)
        val plain = ByteArray(encrypted.size) { i ->
            (encrypted[i].toInt() xor key[i % key.size].toInt()).toByte()
        }
        val decoded = runCatching { String(plain, Charsets.UTF_8) }.getOrNull() ?: return null
        return Regex("https?://[^\\\"'\\s<>]+\\.kinescopecdn\\.net/hls/[^\\\"'\\s<>]+/index\\.m3u8(?:\\?[^\\\"'\\s<>]*)?", RegexOption.IGNORE_CASE)
            .find(decoded)?.value
            ?.replace("\\/", "/")
            ?.replace("\\u0026", "&")
    }

'''
          if marker not in s:
              raise SystemExit('kinescope fonksiyonu bulunamadı')
          if 'private fun decodeKinescopeApi(body: String): String?' not in s:
              s = s.replace(marker, decoder + marker, 1)

          old_resolver = '        val resolver = WebViewResolver(interceptUrl = m3u, additionalUrls = listOf(api), userAgent = ua, useOkhttp = true, timeout = 90_000L, script = script)'
          new_resolver = '        val resolver = WebViewResolver(interceptUrl = Regex("(?:m3u8|/api/v1/embed/)", RegexOption.IGNORE_CASE), additionalUrls = emptyList(), userAgent = ua, useOkhttp = true, timeout = 90_000L, script = script)'
          if old_resolver not in s:
              raise SystemExit('resolver satırı bulunamadı')
          s = s.replace(old_resolver, new_resolver, 1)

          old_callback = '            if (m3u.containsMatchIn(u)) { stream = u; true } else false'
          new_callback = '''            if (m3u.containsMatchIn(u)) {
                stream = u
                true
            } else if (api.containsMatchIn(u)) {
                val apiBody = runCatching {
                    app.get(u, referer = target, headers = mapOf("Referer" to target, "User-Agent" to ua)).text
                }.getOrNull()
                val decoded = apiBody?.let(::decodeKinescopeApi)
                if (!decoded.isNullOrBlank()) {
                    Log.d("HintFilmIzle", "KINESCOPE_MANIFEST=" + decoded)
                    stream = decoded
                    true
                } else false
            } else false'''
          if old_callback not in s:
              raise SystemExit('resolver callback satırı bulunamadı')
          s = s.replace(old_callback, new_callback, 1)

          p.write_text(s, encoding='utf-8')
          print('HintFilmIzle API decoder eklendi')
          PY
      - name: Tüm Eklentileri Derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          sed -i 's/; duration = duration;/; this.duration = duration;/g' HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt
          sed -i 's/this.duration = durationText/this.duration = durationText?.substringBefore(" ")?.toIntOrNull()/g' HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt
          sed -i 's/        response = runCatching { app.get(url, referer = "$mainUrl\\/", headers = headers()) }.getOrNull()/        runCatching { app.get(url, referer = "$mainUrl\\/", headers = headers()) }.getOrNull()?.let { response = it }/' HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt
          sed -i 's/            response = runCatching { app.get(fallbackUrl, referer = "$mainUrl\\/", headers = headers()) }.getOrNull()/            runCatching { app.get(fallbackUrl, referer = "$mainUrl\\/", headers = headers()) }.getOrNull()?.let { response = it }/' HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt
          ./gradlew make --stacktrace
      - name: Tüm Derlemeleri Yükle
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/builds
          find . -maxdepth 1 -name "*.cs3" -type f -delete
          find "$GITHUB_WORKSPACE/src" -mindepth 2 -path "*/build/*.cs3" -type f -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path.cwd(); manifest = root / 'plugins.json'
          if manifest.exists():
              data = json.loads(manifest.read_text(encoding='utf-8'))
              built = {p.stem: p for p in root.glob('*.cs3')}
              data = [item for item in data if item.get('internalName') in built]
              updated = 0
              for item in data:
                  internal = item.get('internalName')
                  target = built.get(internal or '')
                  if not target:
                      continue
                  digest = hashlib.sha256(target.read_bytes()).hexdigest()
                  item['fileSize'] = target.stat().st_size
                  item['fileHash'] = f'sha256-{digest}'
                  item['url'] = f'https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/{target.name}?v={os.environ.get("GITHUB_SHA", "build")}'; updated += 1
              manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(f'Updated manifest entries: {updated}')
          PY
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add *.cs3 plugins.json
          git commit -m "Yeni tüm eklenti derlemeleri: $GITHUB_SHA" || exit 0
          git push origin HEAD:builds --force
