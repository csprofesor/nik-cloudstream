name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"
          fetch-depth: 0
          persist-credentials: false

      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Kinescope Resolver Düzeltmesi
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["GITHUB_WORKSPACE"]) / "src/HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt"
          s = p.read_text(encoding="utf-8")
          old = s
          s = s.replace(
              'additionalUrls = listOf(Regex("""https?://[^\\\"\'\\\\s]*kinescopecdn\\.net/.*""", RegexOption.IGNORE_CASE)),',
              'additionalUrls = emptyList(),'
          )
          s = s.replace('useOkhttp = false,', 'useOkhttp = true,')

          # Kinescope artık doğrudan HLS manifest bağlantısını da destekliyor.
          # Önce kararlı master.m3u8 adresini dene; WebView imzalı CDN keşfi
          # başarısız olursa mevcut fallback olarak çalışmaya devam eder.
          needle = '        val manifestUrl = capturedManifest ?: return false'
          replacement = '''        val directManifest = "https://kinescope.io/$videoId/master.m3u8"
        runCatching {
            callback(newExtractorLink(source = name, name = "HintFilmİzle Kinescope Direct", url = directManifest, type = ExtractorLinkType.M3U8) {
                referer = parentUrl
                headers = mapOf(
                    "Referer" to parentUrl,
                    "Origin" to "https://www.hintfilmizle.com",
                    "User-Agent" to userAgent,
                    "Accept" to "*/*",
                    "Accept-Language" to "tr-TR,tr;q=0.9,en-US;q=0.8,en;q=0.7"
                )
                quality = getQualityFromName(directManifest)
            })
        }

        val manifestUrl = capturedManifest ?: return true'''
          if needle in s and 'Kinescope Direct' not in s:
              s = s.replace(needle, replacement, 1)

          if s == old:
              raise SystemExit("Kinescope resolver hedefleri bulunamadı; derleme durduruldu")
          p.write_text(s, encoding="utf-8")
          print("Kinescope patch: okhttp=true + direct master.m3u8 fallback enabled")
          PY

      - name: Cache Temizle
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.m2/repository

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 17

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2

      - name: Tüm Eklentileri Derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make --stacktrace

      - name: Tüm Derlemeleri Yükle
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/builds
          find . -maxdepth 1 -name "*.cs3" -type f -delete
          find "$GITHUB_WORKSPACE/src" -mindepth 2 -path "*/build/*.cs3" -type f -exec cp {} "$GITHUB_WORKSPACE/builds/" \;

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path.cwd()
          manifest = root / "plugins.json"
          target = root / "HintFilmIzle.cs3"
          if manifest.exists() and target.exists():
              data = json.loads(manifest.read_text(encoding="utf-8"))
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              size = target.stat().st_size
              cache = os.environ.get("GITHUB_SHA", "build")
              updated = False
              for item in data:
                  if item.get("internalName") == "HintFilmIzle":
                      item["fileSize"] = size
                      item["fileHash"] = f"sha256-{digest}"
                      item["url"] = f"https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/HintFilmIzle.cs3?v={cache}"
                      updated = True
                      break
              if updated:
                  manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  print(f"HintFilmIzle metadata updated: size={size} sha256={digest}")
          PY

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add *.cs3 plugins.json
          git commit -m "Yeni tüm eklenti derlemeleri: $GITHUB_SHA" || exit 0
          git push origin HEAD:builds --force
