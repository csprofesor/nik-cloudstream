name: Derleyici

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java Kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tüm Eklentileri Derle
        working-directory: src
        run: ./gradlew make --stacktrace

      - name: DiziPalOriginal'i kendi kaynak kodundan derle
        working-directory: src
        run: ./gradlew :DiziPalOriginal:make --stacktrace

      - name: "'build' Derlemelerini Yükle"
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/builds"
          find . -maxdepth 1 -name "*.cs3" -type f -delete
          find "$GITHUB_WORKSPACE/src" -mindepth 2 -path "*/build/*.cs3" -type f -exec cp {} "$GITHUB_WORKSPACE/builds/" \;

          # DiziPalOriginal artık harici Kraptor derlemesiyle ezilmiyor.
          # Kendi kaynak kodundan üretilen .cs3 dosyası kullanılır.
          test -f "$GITHUB_WORKSPACE/builds/DiziPalOriginal.cs3"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path.cwd()
          manifest = root / 'plugins.json'
          if manifest.exists():
              try:
                  data = json.loads(manifest.read_text(encoding='utf-8'))
              except Exception:
                  data = []
              if not isinstance(data, list):
                  data = []

              plugin = {
                  "status": 1,
                  "version": 1,
                  "name": "DiziPalOrijinal",
                  "internalName": "DiziPalOrijinal",
                  "authors": ["csprofesor"],
                  "description": "DiziPal Orijinal.",
                  "repositoryUrl": "https://github.com/csprofesor/nik-cloudstream",
                  "language": "tr",
                  "tvTypes": ["TvSeries", "Movie"],
                  "iconUrl": "https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://dizipal932.com&size=128",
                  "apiVersion": 1
              }
              data = [item for item in data if isinstance(item, dict) and item.get('internalName') != 'DiziPalOrijinal']
              data.append(plugin)

              for item in data:
                  if isinstance(item, dict) and item.get('internalName') == 'DiziPalOrijinal':
                      p = root / 'DiziPalOriginal.cs3'
                      if p.exists():
                          item['hash'] = hashlib.sha256(p.read_bytes()).hexdigest()
                          item['file'] = 'DiziPalOriginal.cs3'

              manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
