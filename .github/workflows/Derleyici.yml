name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}
      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          ref: "builds"
          path: "builds"
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}
      - name: Cache Temizle
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.m2/repository
      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 17
      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2
      - name: HintFilmIzle Kaynak Düzeltmeleri
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src"
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt")
          text = path.read_text(encoding="utf-8")

          # Kotlin nullable-response compile fix.
          old = '''        var response = runCatching { app.get(url, referer = "$mainUrl/", headers = headers()) }.getOrNull()
            ?: return newHomePageResponse(request.name, emptyList(), hasNext = false)
'''
          new = '''        var response = runCatching { app.get(url, referer = "$mainUrl/", headers = headers()) }.getOrNull()
        if (response == null) return newHomePageResponse(request.name, emptyList(), hasNext = false)
'''
          if old in text:
              text = text.replace(old, new, 1)

          # Replace the old Kinescope resolver with the ZIP/research-compatible
          # route: the real Kinescope player generates /api/v1/embed/<id>,
          # whose JSON {p,v} payload is reverse+Base64+cyclic-XOR encoded.
          # Decode it inside the WebView so no suspend app.get() is called from
          # WebViewResolver's non-suspend callback.
          start = text.find('    private suspend fun kinescope(')
          end = text.find('    override suspend fun loadLinks(', start)
          if start < 0 or end < 0:
              raise SystemExit('Kinescope function boundaries not found')

          kinescope = r'''    private suspend fun kinescope(kine: String, parent: String, callback: (ExtractorLink) -> Unit): Boolean = runCatching {
          val id = Regex("/embed/([A-Za-z0-9_-]+)", RegexOption.IGNORE_CASE).find(kine)?.groupValues?.getOrNull(1) ?: return false
          val target = if (kine.contains("river-3-329.kinescopecdn.net", true)) kine else
              "https://river-3-329.kinescopecdn.net/677113747/embed/$id?design=3&lang=${URLEncoder.encode(lang.ifBlank { "tr" }, "UTF-8")}&autoplay=1&muted=1&preload=1&playsinline=1&background=1&enableIframeApi=1&nc=${System.currentTimeMillis() / 1000L}"

          val manifestRegex = Regex(
              "https?://[^\\\"'\\\\s<>]+\\\\.kinescopecdn\\\\.net/hls/[^\\\"'\\\\s<>]+/index\\\\.m3u8(?:\\\\?[^\\\"'\\\\s<>]*)?",
              RegexOption.IGNORE_CASE
          )
          var stream: String? = null
          var streamHeaders: Map<String, String> = emptyMap()

          val script = """
              (function() {
                try {
                  if (window.__csHintKineV5) return true;
                  window.__csHintKineV5 = true;

                  var KEY = 'RySdvcyu5iTUxn97vn4HwoniwgxaCynA';

                  function findManifest(value, seen) {
                    try {
                      if (value == null) return null;
                      if (typeof value === 'string') {
                        var m = value.match(/https?:\\/\\/[^\\s\"']+\\.kinescopecdn\\.net\\/hls\\/[^\\s\"']+\\/index\\.m3u8(?:\\?[^\\s\"']*)?/i);
                        return m ? m[0] : null;
                      }
                      if (typeof value !== 'object') return null;
                      seen = seen || [];
                      if (seen.indexOf(value) >= 0) return null;
                      seen.push(value);
                      if (Array.isArray(value)) {
                        for (var i = 0; i < value.length; i++) { var a = findManifest(value[i], seen); if (a) return a; }
                      } else {
                        for (var k in value) { try { var b = findManifest(value[k], seen); if (b) return b; } catch (_) {} }
                      }
                    } catch (_) {}
                    return null;
                  }

                  function trigger(url) {
                    try {
                      if (!url || window.__csHintManifest === url) return;
                      window.__csHintManifest = url;
                      var v = document.createElement('video');
                      v.muted = true;
                      v.setAttribute('muted', '');
                      v.setAttribute('playsinline', '');
                      v.preload = 'auto';
                      v.src = url;
                      (document.documentElement || document.body).appendChild(v);
                      v.load();
                    } catch (_) {}
                  }

                  function decodeApi(text) {
                    try {
                      var parsed = JSON.parse(text);
                      if (!parsed || typeof parsed.p !== 'string') return null;
                      var encoded = parsed.p.split('').reverse().join('');
                      var binary = atob(encoded);
                      var out = new Uint8Array(binary.length);
                      for (var i = 0; i < binary.length; i++) {
                        out[i] = binary.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length);
                      }
                      var decoded = new TextDecoder('utf-8').decode(out);
                      return findManifest(JSON.parse(decoded), []);
                    } catch (_) { return null; }
                  }

                  function inspect(text) {
                    try {
                      var direct = findManifest(text, []);
                      if (direct) { trigger(direct); return; }
                      var decoded = decodeApi(text);
                      if (decoded) trigger(decoded);
                    } catch (_) {}
                  }

                  var ofetch = window.fetch;
                  if (ofetch) {
                    window.fetch = function() {
                      var args = arguments;
                      try {
                        var u = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url);
                        if (/\\.m3u8(?:\\?|$)/i.test(String(u || ''))) trigger(String(u));
                      } catch (_) {}
                      return ofetch.apply(this, args).then(function(r) {
                        try { r.clone().text().then(inspect).catch(function(){}); } catch (_) {}
                        return r;
                      });
                    };
                  }

                  var oopen = XMLHttpRequest.prototype.open;
                  var osend = XMLHttpRequest.prototype.send;
                  XMLHttpRequest.prototype.open = function(method, url) {
                    this.__csUrl = String(url || '');
                    return oopen.apply(this, arguments);
                  };
                  XMLHttpRequest.prototype.send = function() {
                    try {
                      this.addEventListener('load', function() {
                        var u = String(this.__csUrl || '');
                        if (/\\.m3u8(?:\\?|$)/i.test(u)) trigger(u);
                        if (u.indexOf('/api/v1/embed/') >= 0) inspect(this.responseText || '');
                      });
                    } catch (_) {}
                    return osend.apply(this, arguments);
                  };

                  return true;
                } catch (_) { return false; }
              })()
          """.trimIndent()

          resolver = '''          val resolver = WebViewResolver(
              interceptUrl = Regex("(?:m3u8|/api/v1/embed/)", RegexOption.IGNORE_CASE),
              additionalUrls = emptyList(),
              userAgent = ua,
              useOkhttp = true,
              timeout = 90_000L,
              script = script
          )

          resolver.resolveUsingWebView(
              target,
              referer = parent,
              headers = mapOf(
                  "Referer" to parent,
                  "Origin" to mainUrl,
                  "User-Agent" to ua,
                  "Accept-Language" to "tr-TR,tr;q=0.9,en-US;q=0.8,en;q=0.7"
              )
          ) { req ->
              val u = req.url.toString()
              if (manifestRegex.containsMatchIn(u)) {
                  stream = u
                  streamHeaders = req.headers.toMap()
                  Log.d("HintFilmIzle", "KINESCOPE_MANIFEST=" + u)
                  true
              } else false
          }

          val final = stream ?: return false
          val finalHeaders = linkedMapOf(
              "Referer" to (streamHeaders["Referer"] ?: target),
              "User-Agent" to (streamHeaders["User-Agent"] ?: ua),
              "Accept" to (streamHeaders["Accept"] ?: "*/*")
          )
          streamHeaders["Origin"]?.takeIf { it.isNotBlank() }?.let { finalHeaders["Origin"] = it }
          streamHeaders["Accept-Language"]?.takeIf { it.isNotBlank() }?.let { finalHeaders["Accept-Language"] = it }

          callback(newExtractorLink(source = name, name = "HintFilmİzle Kinescope", url = final, type = ExtractorLinkType.M3U8) {
              referer = finalHeaders["Referer"] ?: target
              headers = finalHeaders
              quality = getQualityFromName(final)
          })
          true
'''

          # Keep the already-present helper functions untouched; only replace the
          # broken resolver body. The API decoder remains in source as a fallback
          # helper but is no longer called from the non-suspend callback.
          text = text[:start] + kinescope + resolver + '\n' + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: HintFilmIzle Derleme Kontrolü
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          success=0
          for attempt in 1 2 3; do
            echo "HintFilmIzle derleme denemesi $attempt/3"
            if ./gradlew :HintFilmIzle:make --stacktrace; then
              success=1
              break
            fi
            echo "HintFilmIzle denemesi $attempt başarısız; cache temizleniyor ve tekrar deneniyor."
            rm -rf ~/.gradle/caches
          done
          test "$success" = 1
      - name: Tüm Eklentileri Derle
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          success=0
          for attempt in 1 2 3; do
            echo "Tüm eklenti derleme denemesi $attempt/3"
            if ./gradlew make --stacktrace; then
              success=1
              break
            fi
            echo "Genel derleme denemesi $attempt başarısız; cache temizleniyor ve tekrar deneniyor."
            rm -rf ~/.gradle/caches
          done
          test "$success" = 1
      - name: "'build' Derlemelerini Yükle"
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/builds"
          find . -maxdepth 1 -name "*.cs3" -type f -delete
          find "$GITHUB_WORKSPACE/src" -mindepth 2 -path "*/build/*.cs3" -type f -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path.cwd()
          manifest = root / 'plugins.json'
          if manifest.exists():
              data = json.loads(manifest.read_text(encoding='utf-8'))
              built = {p.stem: p for p in root.glob('*.cs3')}
              data = [item for item in data if item.get('internalName') in built]
              for item in data:
                  target = built.get(item.get('internalName', ''))
                  if target:
                      digest = hashlib.sha256(target.read_bytes()).hexdigest()
                      item['fileSize'] = target.stat().st_size
                      item['fileHash'] = f'sha256-{digest}'
                      item['url'] = f'https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/{target.name}?v={os.environ.get("GITHUB_SHA", "build")}'
              manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add *.cs3 plugins.json
          git commit -m "Yeni tüm eklenti derlemeleri: $GITHUB_SHA" || exit 0
          git push origin HEAD:builds --force
