name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: src
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          ref: builds
          path: builds
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Cache Temizle
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.m2/repository

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 17

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2

      - name: HintFilmIzle Kinescope + Reklam Engelleme
        working-directory: src
        run: python3 .github/hintfilmizle_kinescope_fix.py

      - name: HintFilmIzle Derleme Kontrolü
        working-directory: src
        run: ./gradlew :HintFilmIzle:make --stacktrace

      - name: Tüm Eklentileri Derle
        working-directory: src
        run: ./gradlew make --stacktrace

      - name: "'build' Derlemelerini Yükle"
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/builds"
          find . -maxdepth 1 -name "*.cs3" -type f -delete
          find "$GITHUB_WORKSPACE/src" -mindepth 2 -path "*/build/*.cs3" -type f -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path.cwd()
          manifest = root / 'plugins.json'
          if manifest.exists():
              try:
                  data = json.loads(manifest.read_text(encoding='utf-8'))
              except Exception:
                  data = []
              if not isinstance(data, list):
                  data = []
              built = {p.stem: p for p in root.glob('*.cs3')}
              data = [item for item in data if isinstance(item, dict)]
              data = [item for item in data if item.get('internalName') in built]
              for item in data:
                  target = built.get(item.get('internalName', ''))
                  if target:
                      digest = hashlib.sha256(target.read_bytes()).hexdigest()
                      item['fileSize'] = target.stat().st_size
                      item['fileHash'] = f'sha256-{digest}'
                      item['url'] = f'https://raw.githubusercontent.com/csprofesor/nik-cloudstream/builds/{target.name}?v={os.environ.get("GITHUB_SHA", "build")}'
              manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          dosyalar=()
          while IFS= read -r dosya; do
            dosyalar+=("$dosya")
          done < <(find . -maxdepth 1 -name "*.cs3" -type f -print | sort)
          if [ -f plugins.json ]; then
            dosyalar+=("plugins.json")
          fi
          if [ "${#dosyalar[@]}" -eq 0 ]; then
            echo "Yüklenecek dosya yok, atlanıyor."
            exit 0
          fi
          git add -- "${dosyalar[@]}"
          if git diff --cached --quiet; then
            echo "Yüklenecek değişiklik yok, atlanıyor."
            exit 0
          fi
          git commit -m "Yeni tüm eklenti derlemeleri: $GITHUB_SHA"
          git push origin HEAD:builds --force
