name: 🌐 Domain Auto Update

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: domain-auto-update
  cancel-in-progress: false

jobs:
  auto-fix-domains:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu indir
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: 🐍 Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: ⚙️ Git yapılandır
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"

      - name: 🔍 Domainleri kontrol et ve düzelt
        id: domain_fix
        run: |
          python auto_fix_domains.py --report-file /tmp/domain-check-report.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path('/tmp/domain-check-report.json').read_text(encoding='utf-8'))
          updated = report.get('updated_plugins', [])
          print(f"updated_count={len(updated)}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"updated_count={len(updated)}\n")
            out.write(f"has_changes={'true' if updated else 'false'}\n")

          lines = [
            "# Domain Auto Update Report",
            f"- Checked plugins: {report.get('checked_plugins', 0)}",
            f"- Reachable plugins: {report.get('reachable_plugins', 0)}",
            f"- Updated plugins: {len(updated)}",
          ]

          if updated:
            lines.append("\n## Updated domains")
            for item in updated:
              lines.append(f"- **{item['plugin']}**: `{item['old_domain']}` → `{item['new_domain']}` ({item['source']})")

          Path('/tmp/domain-report.md').write_text("\n".join(lines), encoding='utf-8')
          PY

      - name: 📋 Raporu iş özeti olarak ekle
        run: cat /tmp/domain-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 📝 Branch, commit ve push
        if: steps.domain_fix.outputs.has_changes == 'true'
        run: |
          git checkout -B domain-auto-fix
          git add -A
          git commit -m "chore(domains): auto-fix broken plugin domains" \
                     -m "Scheduled domain auto-fix run at $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No commit created"
          git push origin domain-auto-fix --force

      - name: 🔀 Pull request oluştur veya güncelle
        if: steps.domain_fix.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          base_branch = os.environ['BASE_BRANCH']
          owner, name = repo.split('/')

          report_lines = Path('/tmp/domain-report.md').read_text(encoding='utf-8')

          req = urllib.request.Request(
              f"https://api.github.com/repos/{owner}/{name}/pulls?state=open&head={owner}:domain-auto-fix&base={base_branch}",
              headers={
                  "Authorization": f"token {token}",
                  "Accept": "application/vnd.github+json",
              },
          )
          with urllib.request.urlopen(req) as resp:
              existing = json.loads(resp.read().decode('utf-8'))

          body = report_lines + "\n\n---\nThis PR is automatically generated by `domain-auto-update.yml`."

          if existing:
              pr_number = existing[0]['number']
              update_req = urllib.request.Request(
                  f"https://api.github.com/repos/{owner}/{name}/pulls/{pr_number}",
                  data=json.dumps({"title": "🌐 Automatic Domain Update", "body": body}).encode('utf-8'),
                  method='PATCH',
                  headers={
                      "Authorization": f"token {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
              )
              urllib.request.urlopen(update_req).read()
          else:
              create_req = urllib.request.Request(
                  f"https://api.github.com/repos/{owner}/{name}/pulls",
                  data=json.dumps({
                      "title": "🌐 Automatic Domain Update",
                      "head": "domain-auto-fix",
                      "base": base_branch,
                      "body": body,
                  }).encode('utf-8'),
                  method='POST',
                  headers={
                      "Authorization": f"token {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(create_req) as resp:
                  created = json.loads(resp.read().decode('utf-8'))
              pr_number = created['number']

          comment_req = urllib.request.Request(
              f"https://api.github.com/repos/{owner}/{name}/issues/{pr_number}/comments",
              data=json.dumps({"body": "### ✅ Updated domains\n\n" + report_lines}).encode('utf-8'),
              method='POST',
              headers={
                  "Authorization": f"token {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(comment_req).read()
          print(f"PR #{pr_number} updated")
          PY

      - name: ⏭️ Değişiklik yok
        if: steps.domain_fix.outputs.has_changes == 'false'
        run: echo "No domain updates detected"
