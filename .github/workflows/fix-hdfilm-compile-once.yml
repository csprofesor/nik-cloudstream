name: HDFilmSitesi Compile Fix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'HDFilmSitesi derleme düzeltmesi') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix compile error
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('HDFilmSitesi/src/main/kotlin/com/nikyokki/HDFilmSitesi.kt')
          s = p.read_text(encoding='utf-8')
          old = '.substringBefore(Regex("\\\\s+"))'
          if old not in s:
              raise SystemExit('Expected expression not found')
          p.write_text(s.replace(old, '.substringBefore(" ")', 1), encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HDFilmSitesi/src/main/kotlin/com/nikyokki/HDFilmSitesi.kt
          git rm .github/workflows/fix-hdfilm-compile-once.yml
          git commit -m "HDFilmSitesi derleme düzeltmesi"
          git push origin HEAD:master
