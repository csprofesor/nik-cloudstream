name: Retry HintFilmIzle Home Fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt')
          s = p.read_text()
          s = s.replace('duration = duration?.removeSuffix(" dk.")?.toIntOrNull()', 'duration = duration')
          old = 'val r = runCatching { results(app.get(url, referer = "$mainUrl/", headers = headers()).document) }.getOrDefault(emptyList())\n        return newHomePageResponse(request.name, r, hasNext = r.isNotEmpty())'
          new = '''val response = runCatching { app.get(url, referer = "$mainUrl/", headers = headers()) }.getOrNull()\n            ?: return newHomePageResponse(request.name, emptyList(), hasNext = false)\n        val doc = response.document\n        if (request.data.contains("/tur/", ignoreCase = true)) {\n            val heading = doc.selectFirst("h1")?.text()?.trim().orEmpty()\n            val expected = request.name.removeSuffix(" Filmleri").trim()\n            if (expected.isNotBlank() && !heading.contains(expected, ignoreCase = true)) {\n                return newHomePageResponse(request.name, emptyList(), hasNext = false)\n            }\n        }\n        val r = results(doc)\n        return newHomePageResponse(request.name, r, hasNext = r.isNotEmpty())'''
          if old not in s:
              raise SystemExit('home block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Build
        run: |
          cd src
          chmod +x gradlew
          ./gradlew make --stacktrace
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix HintFilmIzle home sections'
          git push
