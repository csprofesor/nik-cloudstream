name: HDFilmSitesi Poster Fix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'HDFilmSitesi poster düzeltmesi') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch poster URL extraction
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('HDFilmSitesi/src/main/kotlin/com/nikyokki/HDFilmSitesi.kt')
          text = path.read_text(encoding='utf-8')

          start = text.index('    private fun Element.findPosterUrl(): String? {')
          end = text.index('    private fun Element.findCardTitle(): String? {', start)

          replacement = r'''    private fun Element.findPosterUrl(): String? {
          fun normalize(raw: String): String? {
              val value = raw
                  .trim()
                  .removePrefix("\"")
                  .removeSuffix("\"")
                  .removePrefix("'")
                  .removeSuffix("'")
                  .trim()
                  .substringBefore(Regex("\\s+"))
                  .trim()
              if (value.isBlank() || value.startsWith("data:image")) return null
              return fixUrlNull(value)
          }

          var current: Element? = this
          repeat(8) {
              val image = current?.selectFirst("img")
              if (image != null) {
                  val candidates = sequenceOf(
                      image.attr("data-src"),
                      image.attr("data-lazy-src"),
                      image.attr("data-original"),
                      image.attr("data-image"),
                      image.attr("data-srcset"),
                      image.attr("srcset"),
                      image.attr("src")
                  )

                  for (candidate in candidates) {
                      if (candidate.isBlank()) continue
                      val urls = if (candidate.contains(',')) candidate.split(',') else listOf(candidate)
                      for (url in urls) {
                          normalize(url)?.let { return it }
                      }
                  }
              }

              val style = current?.attr("style").orEmpty()
              val background = Regex("url\\(['\\\"]?([^'\\\")]+)")
                  .find(style)
                  ?.groupValues
                  ?.getOrNull(1)
              normalize(background.orEmpty())?.let { return it }

              current = current?.parent()
          }
          return null
      }

'''

          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          print('Patched:', path)
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HDFilmSitesi/src/main/kotlin/com/nikyokki/HDFilmSitesi.kt .github/workflows/fix-hdfilm-poster-once.yml
          git rm .github/workflows/fix-hdfilm-poster-once.yml
          git commit -m "HDFilmSitesi poster düzeltmesi"
          git push origin master
