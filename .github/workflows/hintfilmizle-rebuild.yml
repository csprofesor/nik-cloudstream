name: HintFilmIzle Rebuild
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'HintFilm parser rebuild') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix player discovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt')
          s=p.read_text()
          a=s.index('    override suspend fun loadLinks(')
          b=s.rfind('\n}')
          links='''    override suspend fun loadLinks(
        data: String,
        isCasting: Boolean,
        subtitleCallback: (SubtitleFile) -> Unit,
        callback: (ExtractorLink) -> Unit
    ): Boolean {
        val document = runCatching {
            app.get(data, referer = "$mainUrl/", headers = browserHeaders()).document
        }.getOrNull() ?: return false
        val players = linkedSetOf<String>()
        fun addPlayer(value: String?) {
            if (value.isNullOrBlank()) return
            val raw = value.replace("\\\\/", "/").replace("\\\\u0026", "&").replace("&amp;", "&").trim().trim('"', '\\'')
            playerUrl(raw, data)?.let { u ->
                if (!isIgnoredPlayer(u) && !isTrailerPlayer(u) && !u.startsWith(mainUrl, true)) players.add(u)
            }
        }
        document.select("[data-frame]").forEach { addPlayer(it.attr("data-frame")) }
        document.select("iframe[src],iframe[data-src],iframe[data-url],[data-player],[data-embed],[data-video],[data-iframe]").forEach { e ->
            listOf(e.attr("src"),e.attr("data-src"),e.attr("data-url"),e.attr("data-player"),e.attr("data-embed"),e.attr("data-video"),e.attr("data-iframe")).forEach(::addPlayer)
        }
        document.select("[data-publisher-id][data-id]").forEach { e ->
            val pub=e.attr("data-publisher-id").trim()
            val id=e.attr("data-id").trim()
            if (pub.isNotBlank() && id.isNotBlank()) {
                players.add("https://river-3-329.kinescopecdn.net/$pub/embed/$id?voiceover=487&design=3&lang=tr&nc=${System.currentTimeMillis()/1000L}")
            }
        }
        document.select("script").forEach { sc ->
            Regex("data-frame\\\\s*=\\\\s*[\\\"']([^\\\"']+)[\\\"']", RegexOption.IGNORE_CASE)
                .findAll(sc.data()).forEach { addPlayer(it.groupValues[1]) }
            Regex("https?://player\\\\.hintfilmizle\\\\.com/embed/[A-Za-z0-9_-]+", RegexOption.IGNORE_CASE)
                .findAll(sc.data()).forEach { addPlayer(it.value) }
        }
        Log.d("HintFilmIzle", "PLAYER_COUNT=${players.size}")
        players.forEach { Log.d("HintFilmIzle", "PLAYER=$it") }
        var found=false
        for (player in players) when {
            player.contains("kinescope", true) || player.contains("kinescopecdn", true) -> if (loadKinescope(player, data, callback)) found=true
            player.contains("playmate.to", true) -> if (loadPlaymate(player, data, callback)) found=true
            else -> { runCatching { loadExtractor(player, data, subtitleCallback, callback) }; found=true }
        }
        return found
    }
'''
          s=s[:a]+links+s[b:]
          p.write_text(s)
          print('HintFilmIzle loadLinks rewritten')
          PY
      - name: Commit rewrite
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'HintFilm parser rebuild [skip ci]'
          git push
