name: Fix HintFilmIzle Kinescope

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Patch Kinescope resolver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt')
          s = p.read_text()

          start = s.index('    private suspend fun loadKinescope(')
          end = s.index('    override suspend fun loadLinks(', start)

          new = r'''    private suspend fun loadKinescope(
        iframeUrl: String,
        parentUrl: String,
        callback: (ExtractorLink) -> Unit
    ): Boolean = runCatching {
        val userAgent = browserHeaders()["User-Agent"].orEmpty()
        val videoId = Regex("""/embed/([A-Za-z0-9_-]+)""", RegexOption.IGNORE_CASE)
            .find(iframeUrl)?.groupValues?.getOrNull(1) ?: return false

        val livePlayerUrl =
            "https://river-3-329.kinescopecdn.net/677113747/embed/" +
                videoId +
                "?design=3&lang=" +
                URLEncoder.encode(lang.ifBlank { "tr" }, "UTF-8") +
                "&nc=" + (System.currentTimeMillis() / 1000L)

        Log.d("HintFilmIzle", "KINESCOPE_PLAYER=" + livePlayerUrl)

        // Catch the real signed HLS URL generated by Kinescope. Do not cache it.
        val manifestRegex = Regex(
            """https?://[^\"'\\s]+\\.kinescopecdn\\.net/hls/[^\"'\\s]+\\.m3u8(?:\\?[^\"'\\s]*)?""",
            RegexOption.IGNORE_CASE
        )

        var capturedManifest: String? = null
        var capturedHeaders: Map<String, String> = emptyMap()

        // The resolver injects JS while the WebView is making requests. The script
        // below therefore uses timers plus a MutationObserver and searches shadow DOM.
        // It also dispatches real pointer/mouse events instead of relying only on click().
        val script = """
            (function() {
                try {
                    if (window.__csKinescopeFix) return true;
                    window.__csKinescopeFix = true;

                    function walk(root, out) {
                        try {
                            if (!root) return;
                            if (root.querySelectorAll) {
                                root.querySelectorAll('video, button, [role="button"], [aria-label], [title]').forEach(function(e) { out.push(e); });
                                root.querySelectorAll('*').forEach(function(e) {
                                    if (e.shadowRoot) walk(e.shadowRoot, out);
                                });
                            }
                        } catch (_) {}
                    }

                    function fire(el) {
                        try {
                            ['pointerdown','mousedown','pointerup','mouseup','click'].forEach(function(type) {
                                el.dispatchEvent(new MouseEvent(type, {bubbles:true,cancelable:true,view:window}));
                            });
                        } catch (_) {}
                        try { el.click(); } catch (_) {}
                    }

                    function start() {
                        var nodes = [];
                        walk(document, nodes);

                        nodes.forEach(function(el) {
                            try {
                                if (el.tagName && el.tagName.toLowerCase() === 'video') {
                                    el.muted = true;
                                    el.autoplay = true;
                                    el.setAttribute('muted','');
                                    el.setAttribute('playsinline','');
                                    var p = el.play();
                                    if (p && p.catch) p.catch(function(){});
                                }
                            } catch (_) {}

                            try {
                                var text = (
                                    (el.getAttribute('aria-label') || '') + ' ' +
                                    (el.getAttribute('title') || '') + ' ' +
                                    (typeof el.className === 'string' ? el.className : '') + ' ' +
                                    (el.id || '')
                                ).toLowerCase();
                                if (text.indexOf('play') >= 0 || text.indexOf('oynat') >= 0) {
                                    fire(el);
                                }
                            } catch (_) {}
                        });

                        // Kinescope embeds may expose their player object globally.
                        try {
                            var candidates = [window.player, window.kinescopePlayer, window.KinescopePlayer];
                            candidates.forEach(function(p) {
                                if (!p) return;
                                try { if (p.play) p.play(); } catch (_) {}
                                try { if (p.setMuted) p.setMuted(true); } catch (_) {}
                            });
                        } catch (_) {}
                    }

                    start();
                    var observer = new MutationObserver(function() { start(); });
                    observer.observe(document.documentElement || document, {childList:true,subtree:true});
                    var timer = setInterval(start, 700);
                    setTimeout(function(){ clearInterval(timer); try { observer.disconnect(); } catch (_) {} }, 70000);
                    return true;
                } catch (_) { return false; }
            })()
        """.trimIndent()

        val resolver = WebViewResolver(
            interceptUrl = manifestRegex,
            additionalUrls = listOf(
                Regex("""https?://[^\"'\\s]*kinescopecdn\\.net/.*""", RegexOption.IGNORE_CASE)
            ),
            userAgent = userAgent,
            useOkhttp = false,
            timeout = 90_000L,
            script = script
        )

        val requestHeaders = mapOf(
            "Referer" to parentUrl,
            "Origin" to "https://www.hintfilmizle.com",
            "Accept-Language" to "tr-TR,tr;q=0.9,en-US;q=0.8,en;q=0.7",
            "User-Agent" to userAgent
        )

        resolver.resolveUsingWebView(
            url = livePlayerUrl,
            referer = parentUrl,
            headers = requestHeaders
        ) { request ->
            val requestUrl = request.url.toString()
            Log.d("HintFilmIzle", "KINESCOPE_REQUEST=" + requestUrl)

            if (manifestRegex.containsMatchIn(requestUrl)) {
                capturedManifest = requestUrl
                capturedHeaders = request.headers.toMap()
                Log.d("HintFilmIzle", "KINESCOPE_FRESH_MANIFEST=" + requestUrl)
                true
            } else {
                false
            }
        }

        val manifestUrl = capturedManifest ?: return false
        val finalHeaders = linkedMapOf(
            "Referer" to (capturedHeaders["Referer"] ?: livePlayerUrl),
            "User-Agent" to (capturedHeaders["User-Agent"] ?: userAgent),
            "Accept" to (capturedHeaders["Accept"] ?: "*/*")
        )
        capturedHeaders["Origin"]?.takeIf { it.isNotBlank() }?.let { finalHeaders["Origin"] = it }
        capturedHeaders["Accept-Language"]?.takeIf { it.isNotBlank() }?.let { finalHeaders["Accept-Language"] = it }

        callback(
            newExtractorLink(
                source = name,
                name = "HintFilmİzle Kinescope",
                url = manifestUrl,
                type = ExtractorLinkType.M3U8
            ) {
                referer = finalHeaders["Referer"] ?: livePlayerUrl
                this.headers = finalHeaders
                quality = getQualityFromName(manifestUrl)
            }
        )
        true
    }.getOrElse {
        Log.e("HintFilmIzle", "KINESCOPE_FAILED", it)
        false
    }

'''

          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt
          git commit -m 'Capture fresh Kinescope HLS manifest from WebView'
          git push origin master

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-hintfilm-kinescope.yml
          git commit -m 'Remove temporary Kinescope fix workflow'
          git push origin master
