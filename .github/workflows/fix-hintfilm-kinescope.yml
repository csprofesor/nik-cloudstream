name: Fix HintFilmIzle Kinescope

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Patch Kinescope resolver
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt')
          s = p.read_text()

          # The previous generated Kotlin regex had double-escaped regex tokens.
          # Fix only those tokens; do not rewrite the rest of the plugin.
          replacements = {
              r'''[^\"'\\s]+\\.kinescopecdn\\.net/hls/[^\"'\\s]+\\.m3u8''': r'''[^"'\s]+\.kinescopecdn\.net/hls/[^"'\s]+\.m3u8''',
              r'''(?:\\?[^\"'\\s]*)?''': r'''(?:\?[^"'\s]*)?''',
              r'''[^\"'\\s]*kinescopecdn\\.net/.*''': r'''[^"'\s]*kinescopecdn\.net/.*''',
          }

          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed = True

          if not changed:
              raise SystemExit('Expected Kinescope regex pattern was not found; stopping without changing source.')

          p.write_text(s)
          print('Kinescope regex escaping fixed.')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt
          git commit -m 'Fix Kinescope HLS regex escaping'
          git push origin master

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-hintfilm-kinescope.yml
          git commit -m 'Remove temporary Kinescope fix workflow'
          git push origin master
