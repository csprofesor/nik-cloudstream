name: Apply Kinescope v3

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Apply patch
        run: |
          python3 .github/scripts/fix_kinescope.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt
          git rm .github/scripts/fix_kinescope.py
          git rm .github/workflows/apply-kinescope-v3.yml
          git commit -m 'Fix Kinescope manifest capture through API response'
          git push origin master
