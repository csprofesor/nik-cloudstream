name: Fix HintFilmIzle escapes
on:
  push:
    paths:
      - BUILD_TRIGGER_HINTFILMIZLE.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Kotlin regex escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt')
          s = p.read_text()
          s = s.replace('Regex("\\s+")', 'Regex("\\\\s+")')
          s = s.replace('sezon[\\s._-]*', 'sezon[\\\\s._-]*')
          s = s.replace('bölüm[\\s._-]*', 'bölüm[\\\\s._-]*')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix HintFilmIzle Kotlin regex escapes"
          git push
