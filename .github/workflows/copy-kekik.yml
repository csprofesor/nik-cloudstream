name: Copy Kekik Cloudstream

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace repository with Kekik-cloudstream
        shell: bash
        run: |
          set -e
          rm -rf /tmp/kekik
          git clone --depth 1 --branch master https://github.com/muratcesmecioglu/Kekik-cloudstream.git /tmp/kekik
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --delete --exclude='.git' /tmp/kekik/ ./
          rm -f .github/workflows/copy-kekik.yml

      - name: Commit copied repository
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy muratcesmecioglu/Kekik-cloudstream" || exit 0
          git push origin HEAD:master
