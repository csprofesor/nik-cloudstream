name: HintFilmIzle targeted fix 2

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Kinescope API matcher
        shell: python
        run: |
          from pathlib import Path
          p = Path("HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt")
          lines = p.read_text().splitlines()
          changed = False
          for i, line in enumerate(lines):
              if "private val kinescopeApiRegex = Regex(" in line and "/api/v1/embed/" in line:
                  lines[i] = line.replace("/api/v1/embed/", "/api/v1/embed(?:-kp|-serials)?/")
                  changed = True
                  break
          if not changed:
              raise SystemExit("target Kinescope API regex line not found")
          p.write_text("\n".join(lines) + "\n")
      - name: Commit source fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HintFilmIzle/src/main/kotlin/com/nikyokki/HintFilmIzlePlugin.kt
          git rm .hintfilmizle-trigger .hintfilmizle-trigger2 .github/workflows/_hintfilmizle_fix2.yml 2>/dev/null || true
          git commit -m "Fix HintFilmIzle Kinescope API endpoints"
          git push
